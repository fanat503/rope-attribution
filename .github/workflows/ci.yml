name: CI

on: [push, pull_request]

# The workflow only ever reads the repository. No write scopes, no secrets are
# referenced anywhere below.
permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      # Report both versions even when the first one fails, so a 3.10-only
      # regression is not hidden behind a cancelled 3.11 job.
      fail-fast: false
      matrix:
        # Both are the lower bound of requires-python (>=3.10) and the next
        # minor up. Quoted so YAML does not read 3.10 as the float 3.1.
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because tests/test_authorship.py audits the commit
          # record across every ref. The default depth-1 clone leaves it with a
          # single commit and those checks skip instead of running.
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Pin the cache key to the file this workflow actually installs.
          # setup-python's default **/requirements.txt glob is broader than
          # this project's dependency set.
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          # Installs the package and its numpy dependency. The GPU/model
          # stacks are opt-in via real_model_requirements.txt and
          # train_requirements.txt and are intentionally NOT installed here:
          # no GPU, no model downloads, no multi-gigabyte wheels in CI.
          python -m pip install -e .

      - name: Tests
        # No PYTHONPATH is set by hand: [tool.pytest.ini_options] in
        # pyproject.toml sets testpaths and pythonpath for the repo-root run.
        run: python -m pytest -q

      - name: Lint
        # Scoped by [tool.ruff] include to projects/rope_attribution/ and
        # tests/. Do not widen it here to make a red build green.
        run: python -m ruff check .

      - name: Makefile targets exist and `results` regenerates the committed artifacts
        # The README tells a reader that `make all` reproduces the repository. That
        # promise is checked here rather than asserted in prose, because the
        # machine this was written on has no make and the claim would otherwise be
        # unfalsifiable. `results` is the cheapest target that proves the Makefile
        # works and that the committed JSON is still what the code produces.
        #
        # The check is on *values and shape*, not on bytes. The README does not
        # claim byte identity across platforms, and cannot: the JSON writer emits
        # the platform's float repr, so a Linux rerun of the same seeded float64
        # code differs from the Windows-generated committed file in the last bits
        # of a few values (measured: 9 lines in measurements.json, 4 in
        # sensitivity.json). Asserting bytes here failed both matrix jobs on the
        # same commit whose values the suite had just verified.
        #
        # What this step still checks, and the suite cannot: `make results` runs,
        # writes where it says it writes, and neither adds nor deletes files.
        # Value freshness is owned by the per-leaf tolerance gates in the suite
        # above (`test_the_committed_statistics_json_is_current` and the
        # measurements.json freshness tests in test_paper_claims.py and
        # test_readme_claims.py), which compare every float at a relative 1e-12.
        run: |
          make help
          make results
          git status --porcelain -- results/
          bad=$(git status --porcelain -- results/ | grep -vE '^( M|M )' || true)
          if [ -n "$bad" ]; then
            echo "::error::make results created or deleted files under results/"
            echo "$bad"
            exit 1
          fi
