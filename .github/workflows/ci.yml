name: CI

on: [push, pull_request]

# The workflow only ever reads the repository. No write scopes, no secrets are
# referenced anywhere below.
permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      # Report both versions even when the first one fails, so a 3.10-only
      # regression is not hidden behind a cancelled 3.11 job.
      fail-fast: false
      matrix:
        # Both are the lower bound of requires-python (>=3.10) and the next
        # minor up. Quoted so YAML does not read 3.10 as the float 3.1.
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because tests/test_authorship.py audits the commit
          # record across every ref. The default depth-1 clone leaves it with a
          # single commit and those checks skip instead of running.
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Pin the cache key to the file this workflow actually installs.
          # setup-python's default **/requirements.txt glob is broader than
          # this project's dependency set.
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          # Installs the package and its numpy dependency. The GPU/model
          # stacks are opt-in via real_model_requirements.txt and
          # train_requirements.txt and are intentionally NOT installed here:
          # no GPU, no model downloads, no multi-gigabyte wheels in CI.
          python -m pip install -e .

      - name: Tests
        # No PYTHONPATH is set by hand: [tool.pytest.ini_options] in
        # pyproject.toml sets testpaths and pythonpath for the repo-root run.
        run: python -m pytest -q

      - name: Lint
        # Scoped by [tool.ruff] include to projects/rope_attribution/ and
        # tests/. Do not widen it here to make a red build green.
        run: python -m ruff check .

      - name: Makefile targets exist and `results` reproduces the committed artefact
        # The README tells a reader that `make all` reproduces the repository. That
        # promise is checked here rather than asserted in prose, because the
        # machine this was written on has no make and the claim would otherwise be
        # unfalsifiable. `results` is the cheapest target that proves the Makefile
        # works and that the committed JSON is still what the code produces.
        #
        # `measurements.json` and `sensitivity.json` are required byte-identical:
        # on a seeded, CPU-only, float64 run their values have reproduced on every
        # runner so far, and a drift means either the code changed without its
        # artifact or a dependency changed a reduction order.
        #
        # `statistics.json` is exempt from the *byte* comparison, not from the
        # freshness check. Two of its diagnostics divide by a cancellation
        # residue (`max_min_ratio`) or *are* one (`additivity_residual_max`), so
        # the same seeded values differ between runners at the 1e-11 level; the
        # per-leaf tolerance classes in tests/test_statistics.py encode that, and
        # `test_the_committed_statistics_json_is_current` is the value-level gate.
        # It runs in the suite above, so exempting the bytes here does not exempt
        # the artifact from verification.
        run: |
          make help
          make results
          git diff --stat -- results/
          if ! git diff --quiet -- results/ ':!results/statistics.json'; then
            echo "::error::make results changed a committed artifact"
            git diff --stat -- results/ ':!results/statistics.json'
            exit 1
          fi
