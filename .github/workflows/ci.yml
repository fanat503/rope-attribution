name: CI

on: [push, pull_request]

# The workflow only ever reads the repository. No write scopes, no secrets are
# referenced anywhere below.
permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      # Report both versions even when the first one fails, so a 3.10-only
      # regression is not hidden behind a cancelled 3.11 job.
      fail-fast: false
      matrix:
        # Both are the lower bound of requires-python (>=3.10) and the next
        # minor up. Quoted so YAML does not read 3.10 as the float 3.1.
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Pin the cache key to the file this workflow actually installs.
          # Left to its default **/requirements.txt glob, setup-python would
          # match projects/requirements.txt (the GPU pins) instead, keying the
          # cache on a file CI never installs.
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          # Installs the package and its numpy dependency. projects/requirements.txt
          # (torch, transformer-lens, nnsight, ...) is intentionally NOT installed:
          # no GPU, no model downloads, no multi-gigabyte wheels in CI.
          python -m pip install -e .

      - name: Tests
        # No PYTHONPATH is set by hand: [tool.pytest.ini_options] in
        # pyproject.toml sets testpaths and pythonpath for the repo-root run.
        run: python -m pytest -q

      - name: Lint
        # Scoped by [tool.ruff] include to projects/rope_attribution/ and
        # tests/. The projects/frontier-01-*.py archive is deliberately outside
        # that scope; do not widen it here to make a red build green.
        run: python -m ruff check .
