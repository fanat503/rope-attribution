[build-system]
# setuptools >= 77 is required for PEP 639 support: the SPDX `license` string and
# the `license-files` key below are only understood from that version on.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rope-attribution"
version = "0.1.0"
description = "Attribution of rotary position embeddings (RoPE, YaRN, partial-RoPE) for mechanistic-interpretability work on LLM attention."
requires-python = ">=3.10"

# SPDX identifier, taken from the LICENSE file: it is the verbatim, unmodified
# Apache License 2.0 (body, "END OF TERMS AND CONDITIONS", and the standard
# appendix), and NOTICE.md independently records it as `Apache-2.0`.
license = "Apache-2.0"
license-files = ["LICENSE"]

# One author. CITATION.cff, LICENSE, and the paper are pinned to the same name
# by tests/test_author_metadata.py.
#
# `readme` points at README.md, which describes this package.
authors = [{ name = "Ilya Slyatski" }]
readme = "README.md"

# The library itself only needs numpy. The GPU/model experiment stacks are
# opt-in via real_model_requirements.txt and train_requirements.txt and are
# deliberately not duplicated here.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Used by the figure-producing exploration scripts, never by the library or the
# test suite.
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "ruff"]

[tool.setuptools]
# The only real package in this repository lives at projects/rope_attribution,
# i.e. one level below the project root. Naming it explicitly (instead of
# relying on flat-layout auto-discovery, which would also try to treat
# projects/ as a package) plus the package-dir mapping below is what makes
# `pip install -e .` expose `import rope_attribution`.
packages = ["rope_attribution"]

[tool.setuptools.package-dir]
rope_attribution = "projects/rope_attribution"

[tool.pytest.ini_options]
# `pythonpath` needs pytest >= 7. It is what lets `pytest` be run from the
# repository root with no PYTHONPATH set by hand.
testpaths = ["tests"]
pythonpath = ["projects"]

[tool.ruff]
line-length = 88
target-version = "py310"

# Lint scope: the code this repository is actively maintaining, and nothing else.
#
# The generated artifacts under results/ and figures/ are data, not source; the
# test suite and the package are the complete lint surface.
include = ["projects/rope_attribution/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# Conservative, all of it verified to run clean over the scoped files:
#   E4/E7/E9 - ruff's stock defaults (imports, statements, syntax)
#   F        - pyflakes: undefined names, unused imports
#   I        - import sorting
#   B        - bugbear: real bug classes
#   UP       - pyupgrade, for the py310 target
#   SIM      - flake8-simplify
#   RET      - flake8-return
#   RUF100   - unused noqa directives
# Deliberately not enabled: D (docstrings), ANN (annotations), COM/format
# rules, and PT (pytest style) - all of which would impose house style that
# this codebase does not currently follow.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RET", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports the public API of rope.py. It has no __all__ of its
# own, so pyflakes reports every re-exported name as an unused import. This is
# the standard exception for a re-exporting __init__.py; it silences F401
# only, and only in this one file.
"projects/rope_attribution/__init__.py" = ["F401"]
